name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check environment and catalog
        run: python run.py --check
      - name: Validate catalog and published resources without rewriting files
        run: python tools/check_catalog.py
      - name: Test without opening windows
        run: python -m unittest discover -s tests -v
      - name: Check published catalog and browser configs match source
        run: |
          python tools/export_gallery.py
          git diff --exit-code -- docs/gallery.json docs/play/fireworks-config.json docs/play/kaleidoscope-config.json docs/play/heart-config.json
      - name: Compile tracked Python sources
        run: python -c "import pathlib, subprocess; paths = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode('utf-8').split('\0'); [compile(pathlib.Path(p).read_bytes(), p, 'exec') for p in paths if p]"

  browser-model:
    name: Browser models / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test browser models with Node built-in runner
        run: node --test tests/web/*.test.mjs

  optional-export:
    name: Windows / optional PNG export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional export support
        run: python -m pip install -r requirements-export.txt
      - name: Test PNG encoding, vector redraw and atomic save
        run: |
          python -m unittest discover -s tests -p test_export.py -v
          python -m unittest discover -s tests -p test_raster.py -v
          python -m unittest discover -s tests -p test_redraw.py -v
